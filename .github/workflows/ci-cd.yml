name: Student Management CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-scan-publish-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, and generate coverage
        run: mvn --batch-mode clean verify

      - name: Run SonarQube analysis and wait for quality gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.qualitygate.wait=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-management:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/student-management:${{ github.sha }}

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/student-management:${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: IMAGE,DB_HOST,DB_NAME,DB_USERNAME,DB_PASSWORD
          script: |
            set -e
            docker pull "$IMAGE"
            docker stop student-management || true
            docker rm student-management || true
            docker run --detach \
              --name student-management \
              --restart unless-stopped \
              --publish 8080:8080 \
              --env SERVER_PORT=8080 \
              --env SPRING_DATASOURCE_URL="jdbc:mysql://${DB_HOST}:3306/${DB_NAME}" \
              --env SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
              --env SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              "$IMAGE"
            docker image prune --force
